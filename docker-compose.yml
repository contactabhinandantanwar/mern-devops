services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mern-frontend
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - mern-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mern-backend
    expose:
      - "5000"
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
    networks:
      - mern-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mern-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - mern-network
    restart: unless-stopped

networks:
  mern-network:
    driver: bridge
